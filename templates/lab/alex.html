    <script>

        document.addEventListener('DOMContentLoaded', () => {

            // CONFIG

            const API_ENDPOINT = "/api/alex/chat";



            // ELEMENTS

            const configModal = document.getElementById('config-modal');

            const startSessionBtn = document.getElementById('start-session-btn');

            const projectInput = document.getElementById('project-input');

            const roleInput = document.getElementById('role-input');

            const solutionInput = document.getElementById('solution-input');

            const countryInput = document.getElementById('country-input');

            const constraintsInput = document.getElementById('constraints-input');

            const displayProject = document.getElementById('display-project');

            const displayRole = document.getElementById('display-role');

            const displayCountry = document.getElementById('display-country');

            const chatLog = document.getElementById('chat-log');

            const studentInput = document.getElementById('student-input');

            const micButton = document.getElementById('mic-button');

            const sendButton = document.getElementById('send-button');

            const finishTestBtn = document.getElementById('finish-test-btn');

            const summaryReport = document.getElementById('summary-report');

            const summaryContent = document.getElementById('summary-content');

            const downloadPdfBtn = document.getElementById('download-pdf-btn');
            const saveProblemFrameBtn = document.getElementById('save-problem-frame-btn');



            let simulationConfig = {};

            let conversationHistory = [];



            // EVENT LISTENERS

            startSessionBtn.addEventListener('click', startSimulation);

            micButton.addEventListener('click', startVoiceRecognition);

            sendButton.addEventListener('click', handleStudentQuery);

            finishTestBtn.addEventListener('click', generateSummaryReport);

            downloadPdfBtn.addEventListener('click', downloadPDF);
            saveProblemFrameBtn.addEventListener('click', saveProblemFrameArtifact);



            studentInput.addEventListener('keypress', (e) => {

                if (e.key === 'Enter' && !e.shiftKey) {

                    e.preventDefault();

                    handleStudentQuery();

                }

            });



            function startSimulation() {

                const project = projectInput.value.trim();

                const role = roleInput.value.trim();

                const country = countryInput.value.trim();



                simulationConfig = {

                    project: project || "Test Project",

                    role: role || "Skeptical Investor",

                    country: country || "USA",

                    solution: solutionInput.value.trim(),

                    constraints: constraintsInput.value.trim()

                };



                displayProject.textContent = simulationConfig.project;

                displayRole.textContent = simulationConfig.role;

                displayCountry.textContent = simulationConfig.country;



                configModal.style.display = 'none';

                micButton.disabled = false;

                sendButton.disabled = false;



                setTimeout(sendWelcomeMessage, 500);

            }



            function sendWelcomeMessage() {

                const welcomeHTML = `<p>Welcome. I'm <strong>Alex</strong>, acting as a <span class="pill risk">Adversary</span> to stress-test your ideas.</p>

                    <p>I'll challenge your assumptions about <strong>${simulationConfig.project}</strong> from the perspective of a ${simulationConfig.role} in ${simulationConfig.country}.</p>

                    <p>Let's begin. What's your pitch?</p>`;



                conversationHistory.push({

                    sender: 'alex',

                    html: welcomeHTML,

                    assumptions: [],

                    effects: [],

                    questions: []

                });



                addMessageToLog('alex', welcomeHTML);

                speakText("Welcome. I'm Alex, acting as an adversary to stress-test your ideas. What's your pitch?");

            }



            function handleStudentQuery() {

                const studentMessage = studentInput.value.trim();

                if (!studentMessage) return;



                conversationHistory.push({

                    sender: 'user',

                    text: studentMessage

                });

                addMessageToLog('user', studentMessage);

                studentInput.value = '';



                showSpeakingIndicator();



                const systemPrompt = `You are acting as a stakeholder (${simulationConfig.role}) in the project "${simulationConfig.project}" located in ${simulationConfig.country}.

Context: ${simulationConfig.constraints}

Proposed Solution: ${simulationConfig.solution}



CORE PURPOSE:

You are a Socratic companion designed to stress-test ideas. You do NOT provide solutions. You challenge thinking.



ANALYSIS DIMENSIONS:

1. Systemic Risks (Technical, Organizational, Financial)

2. Regulatory & Policy Friction (GDPR, Local Laws, Institutional Rules)

3. Second-Order Effects (Unintended consequences, long-term dynamics)

4. Unvalidated Assumptions (What is the user assuming is true without evidence?)

5. EQUITY & POWER DYNAMICS: Who gets excluded? Who loses power? Who is burdened? (CRITICAL)



RESPONSE GUIDELINES:

- Be empathetic but honest ("productive discomfort").

- Use your specific role/country context.

- Ask 1-2 probing Socratic questions.

- SUPPORT YOUR CLAIMS: Use specific numbers, statistics, and cite real-world sources with HTML links where possible.



IMPORTANT: You must respond in strict JSON format:

{

    "html": "HTML string containing your response. Use <p> tags for text. Wrap specific points in <span class='pill risk'>Risk</span>, <span class='pill assumption'>Assumption</span>, <span class='pill effect'>Effect</span>, or <span class='pill equity'>Equity</span> tags where appropriate. INCLUDE LINKS AND NUMBERS.",

    "assumptions": ["Array of strings extracting the specific unvalidated assumptions identified"],

    "effects": ["Array of strings extracting the specific second-order effects identified"],

    "questions": ["Array of strings containing the key Socratic questions you asked"]

}

Do not include markdown formatting (like \`\`\`json) in your response, just the raw JSON string.`;



                const messagesPayload = [

                    { role: "system", content: systemPrompt },

                    ...conversationHistory.map(msg => ({

                        role: msg.sender === 'user' ? 'user' : 'assistant',

                        content: msg.sender === 'user' ? msg.text : (msg.raw_json ? JSON.stringify(msg.raw_json) : msg.html.replace(/<[^>]*>/g, ''))

                    })),

                    { role: "user", content: studentMessage }

                ];



                fetch(API_ENDPOINT, {

                    method: "POST",

                    headers: {

                        "Content-Type": "application/json"

                    },

                    body: JSON.stringify({

                        model: "gpt-4o",

                        messages: messagesPayload,

                        temperature: 0.7

                    })

                })

                    .then(response => {

                        if (!response.ok) throw new Error(`API Error: ${response.status}`);

                        return response.json();

                    })

                    .then(data => {

                        hideSpeakingIndicator();

                        const content = data.choices[0].message.content;

                        const cleanContent = content.replace(/^```json\s*/, '').replace(/\s*```$/, '');



                        try {

                            const alexResponse = JSON.parse(cleanContent);

                            conversationHistory.push({

                                sender: 'alex',

                                html: alexResponse.html,

                                assumptions: alexResponse.assumptions || [],

                                effects: alexResponse.effects || [],

                                questions: alexResponse.questions || [],

                                raw_json: alexResponse

                            });



                            addMessageToLog('alex', alexResponse.html);

                            speakText(alexResponse.html.replace(/<[^>]*>/g, ''));

                        } catch (e) {

                            console.error("JSON Parse Error:", e);

                            addMessageToLog('alex', `<p>Error parsing response. Raw output: ${cleanContent}</p>`);

                        }

                    })

                    .catch(error => {

                        hideSpeakingIndicator();

                        console.error("Fetch Error:", error);

                        const fallback = {

                            html: `<p>I'm having trouble connecting to my brain (API Error). Please check your API key configuration.</p>`,

                            assumptions: [],

                            effects: [],

                            questions: []

                        };

                        addMessageToLog('alex', fallback.html);

                        conversationHistory.push({ sender: 'alex', ...fallback });

                    });

            }



            function startVoiceRecognition() {

                if (!('webkitSpeechRecognition' in window)) {

                    alert("Voice input is not supported in this browser. Please use Chrome or Edge.");

                    return;

                }



                const recognition = new webkitSpeechRecognition();

                recognition.continuous = false;

                recognition.interimResults = false;

                recognition.lang = 'en-US';



                micButton.style.backgroundColor = '#E74530';

                micButton.style.color = '#FFFFFF';



                recognition.onstart = () => {

                    studentInput.placeholder = "Listening...";

                };



                recognition.onresult = (event) => {

                    const transcript = event.results[0][0].transcript;

                    studentInput.value = transcript;

                };



                recognition.onerror = (event) => {

                    console.error("Speech recognition error", event.error);

                    studentInput.placeholder = "Error listening. Try again.";

                };



                recognition.onend = () => {

                    micButton.style.backgroundColor = '';

                    micButton.style.color = '';

                    studentInput.placeholder = "Type your response here...";

                };



                recognition.start();

            }



            function speakText(text) {

                if (!('speechSynthesis' in window)) return;

                window.speechSynthesis.cancel();



                const utterance = new SpeechSynthesisUtterance(text);

                utterance.lang = 'en-US';

                utterance.rate = 1.0;

                utterance.pitch = 1.0;

                window.speechSynthesis.speak(utterance);

            }



            function addMessageToLog(sender, content) {

                const messageWrapper = document.createElement('div');

                messageWrapper.classList.add('max-w-3xl');

                if (sender === 'user') messageWrapper.classList.add('ml-auto');



                const label = document.createElement('div');

                label.classList.add('mb-1', 'text-xs', 'uppercase', 'tracking-wider', 'text-medium-grey', 'font-bold');

                label.textContent = sender === 'user' ? 'You' : `Alex (${simulationConfig.role})`;

                messageWrapper.appendChild(label);



                const bubble = document.createElement('div');

                bubble.classList.add('rounded-2xl', 'px-5', 'py-4', 'leading-relaxed');



                if (sender === 'user') {

                    bubble.classList.add('bg-primary', 'text-white');

                    bubble.textContent = content;

                } else {

                    bubble.classList.add('bg-white', 'text-near-black', 'border', 'border-vapor-grey');

                    bubble.innerHTML = content;

                }



                messageWrapper.appendChild(bubble);

                chatLog.appendChild(messageWrapper);



                // Improved scrolling logic

                requestAnimationFrame(() => {

                    chatLog.scrollTop = chatLog.scrollHeight;

                });

            }



            function showSpeakingIndicator() {

                const indicator = document.createElement('div');

                indicator.id = 'speaking-indicator';

                indicator.classList.add('max-w-3xl');

                indicator.innerHTML = `

                    <div class="mb-1 text-xs uppercase tracking-wider text-medium-grey font-bold">Alex (${simulationConfig.role})</div>

                    <div class="bg-white border border-vapor-grey rounded-2xl px-5 py-4">

                        <p class="animate-pulse text-medium-grey">Alex is thinking...</p>

                    </div>

                `;

                chatLog.appendChild(indicator);



                // Improved scrolling logic

                requestAnimationFrame(() => {

                    chatLog.scrollTop = chatLog.scrollHeight;

                });

            }



            function hideSpeakingIndicator() {

                const indicator = document.getElementById('speaking-indicator');

                if (indicator) indicator.remove();

            }




            function getVertexRunId() {
                return new URLSearchParams(window.location.search).get('run_id') || localStorage.getItem('vertex_current_run_id');
            }

            async function loadRunArtifact(artifactType) {
                const runId = getVertexRunId();
                if (!runId) return null;
                const response = await fetch(`/api/vertex/runs/${encodeURIComponent(runId)}/artifacts/${artifactType}`);
                if (!response.ok) return null;
                const result = await response.json();
                return result.artifact || null;
            }

            function safeId(value, fallback) {
                return String(value || fallback).toLowerCase().replace(/[^a-z0-9_-]+/g, '_').replace(/^_+|_+$/g, '') || fallback;
            }

            function buildProblemFrameArtifact(projectRecord) {
                const runId = getVertexRunId();
                const now = new Date().toISOString();
                const alexMessages = conversationHistory.filter(msg => msg.sender === 'alex');
                const allAssumptions = alexMessages.flatMap(msg => msg.assumptions || []);
                const allEffects = alexMessages.flatMap(msg => msg.effects || []);
                const allQuestions = alexMessages.flatMap(msg => msg.questions || []);
                const projectId = projectRecord?.project_id || `project_${runId || 'runless'}`;
                const projectRecordId = projectRecord?.artifact_id || 'missing_upstream_project_record';
                const evidenceId = `ev_alex_${safeId(runId, 'runless')}`;
                const assumptionItems = (allAssumptions.length ? allAssumptions : ['The founder has not yet recorded explicit assumptions.']).slice(0, 8).map((statement, index) => ({
                    assumption_id: `asm_alex_${index + 1}`,
                    statement,
                    classification: 'hypothesis',
                    confidence: 0.45,
                    approval_state: 'pending',
                    approved_for_predictive_processing: false,
                    approved_for_financial_processing: false,
                    evidence_refs: [evidenceId]
                }));
                const tensionItems = (allEffects.length ? allEffects : ['Second-order effects need more exploration.']).slice(0, 6).map((statement, index) => ({
                    id: `ten_alex_${index + 1}`,
                    statement,
                    classification: 'hypothesis',
                    confidence: 0.45,
                    evidence_refs: [evidenceId]
                }));
                const unknownItems = (allQuestions.length ? allQuestions : ['What must be learned before this idea can move forward?']).slice(0, 6).map((statement, index) => ({
                    id: `unk_alex_${index + 1}`,
                    statement,
                    classification: 'unknown',
                    confidence: 0,
                    evidence_refs: [evidenceId]
                }));
                return {
                    schema_version: '1.0.0',
                    artifact_type: 'problem_frame',
                    artifact_id: `problem_frame_${safeId(runId, Date.now())}`,
                    project_id: projectId,
                    created_at: now,
                    created_by_role: 'alex',
                    status: 'draft',
                    provenance: { source_kind: 'user_supplied', source_label: 'Alex Socratic challenge summary', ip_owner: 'Paola Hintze', external_components_used: [], notes: 'Mapped from Alex conversation summary into a ProblemFrame draft.' },
                    human_approval: { required: true, state: 'pending', approved_by_role: 'founder', approved_at: now, notes: 'Pending founder/facilitator review.' },
                    validation_errors: [],
                    preceding_artifacts: { project_record_id: projectRecordId },
                    original_challenge: simulationConfig.solution || simulationConfig.project || 'Original challenge not recorded',
                    reframed_problem: { statement: allQuestions[0] || simulationConfig.solution || 'Problem needs reframing', classification: 'hypothesis', confidence: 0.45 },
                    affected_users: [{ user_group_id: 'ug_primary', label: simulationConfig.role || 'Primary stakeholder group', classification: 'hypothesis', evidence_refs: [evidenceId] }],
                    needs: [{ id: 'need_alex_1', statement: allQuestions[0] || 'The team needs a clearer problem frame before committing resources.', classification: 'hypothesis', confidence: 0.45, evidence_refs: [evidenceId] }],
                    assumptions: assumptionItems,
                    tensions: tensionItems,
                    evidence_references: [{ evidence_id: evidenceId, label: 'Alex session summary', source_type: 'synthetic_interview_note', classification: 'hypothesis', contains_personal_data: false, evidence_context: 'synthetic_fixture' }],
                    unknowns: unknownItems,
                    four_dimensions_analysis: {
                        emotional: { summary: 'Stakeholder response and discomfort require explicit review.', classification: 'hypothesis', confidence: 0.4, evidence_refs: [evidenceId] },
                        contextual: { summary: simulationConfig.constraints || 'Context constraints require review.', classification: 'hypothesis', confidence: 0.4, evidence_refs: [evidenceId] },
                        systemic: { summary: allEffects[0] || 'System effects require review.', classification: 'hypothesis', confidence: 0.4, evidence_refs: [evidenceId] },
                        problem_framing: { summary: allQuestions[0] || 'Problem framing remains open.', classification: 'hypothesis', confidence: 0.4, evidence_refs: [evidenceId] }
                    },
                    approval_state: 'pending',
                    revision: 1,
                    updated_at: now
                };
            }

            async function saveProblemFrameArtifact() {
                const runId = getVertexRunId();
                if (!runId) {
                    alert('Create a Golden Path run first from Start Golden Path.');
                    return;
                }
                const projectRecord = await loadRunArtifact('project_record');
                const artifact = buildProblemFrameArtifact(projectRecord);
                const response = await fetch(`/api/vertex/runs/${encodeURIComponent(runId)}/artifacts/problem_frame/save`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(artifact)
                });
                const result = await response.json();
                if (!response.ok || !result.saved) {
                    alert(`ProblemFrame not saved: ${((result.errors || [])[0] || {}).message || result.detail || response.statusText}`);
                    return;
                }
                alert(`ProblemFrame saved to ${runId}`);
            }
            function generateSummaryReport() {

                const alexMessages = conversationHistory.filter(msg => msg.sender === 'alex');

                const allAssumptions = alexMessages.flatMap(msg => msg.assumptions || []);

                const allEffects = alexMessages.flatMap(msg => msg.effects || []);

                const allQuestions = alexMessages.flatMap(msg => msg.questions || []);



                let reportHTML = '<h3 class="text-xl font-bold text-near-black mb-3">Unvalidated Assumptions</h3><ul class="space-y-2 mb-6">';

                if (allAssumptions.length === 0) reportHTML += '<li class="text-medium-grey">No assumptions detected.</li>';

                allAssumptions.forEach(a => reportHTML += `<li class="bg-vapor-grey rounded-lg p-3"><span class="pill assumption">Assumption</span> ${a}</li>`);

                reportHTML += '</ul>';



                reportHTML += '<h3 class="text-xl font-bold text-near-black mb-3">Second-Order Effects</h3><ul class="space-y-2 mb-6">';

                if (allEffects.length === 0) reportHTML += '<li class="text-medium-grey">No effects detected.</li>';

                allEffects.forEach(e => reportHTML += `<li class="bg-vapor-grey rounded-lg p-3"><span class="pill effect">Effect</span> ${e}</li>`);

                reportHTML += '</ul>';



                reportHTML += '<h3 class="text-xl font-bold text-near-black mb-3">Key Questions to Explore</h3><ul class="space-y-2">';

                if (allQuestions.length === 0) reportHTML += '<li class="text-medium-grey">No questions recorded.</li>';

                allQuestions.forEach(q => reportHTML += `<li class="bg-vapor-grey rounded-lg p-3"><span class="pill question">Question</span> ${q}</li>`);

                reportHTML += '</ul>';



                summaryContent.innerHTML = reportHTML;

                summaryReport.classList.remove('hidden');

                summaryReport.classList.add('flex');

            }



            function downloadPDF() {

                const element = document.getElementById('summary-content');

                if (!element) {

                    alert("Error: Summary content not found.");

                    return;

                }



                const opt = {

                    margin: 0.5,

                    filename: `Alex_Session_Summary_${new Date().toISOString().slice(0, 10)}.pdf`,

                    image: { type: 'jpeg', quality: 0.98 },

                    html2canvas: { scale: 2 },

                    jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }

                };



                if (typeof html2pdf === 'undefined') {

                    alert("PDF library not loaded. Please check internet connection.");

                    return;

                }



                html2pdf().set(opt).from(element).save().catch(err => {

                    console.error("PDF Generation Error:", err);

                    alert("Failed to generate PDF. See console for details.");

                });

            }

        });

    </script>
