    <script>
        // STATE
        let currentAnalysis = null;
        let conversationHistory = [];

        // ELEMENTS
        const ideaInput = document.getElementById('idea-input');
        const analyzeBtn = document.getElementById('analyze-btn');
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('file-input');
        const statusMessage = document.getElementById('status-message');
        const saveMapBtn = document.getElementById('save-map-btn');
        const deleteMapBtn = document.getElementById('delete-map-btn');
        const resetZoomBtn = document.getElementById('reset-zoom-btn');
        const tooltip = document.getElementById('d3-tooltip');
        const chatContainer = document.getElementById('chat-container');

        // EVENT LISTENERS
        analyzeBtn.addEventListener('click', runAnalysis);
        uploadBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileUpload);
        saveMapBtn.addEventListener('click', saveCurrentMap);
        deleteMapBtn.addEventListener('click', deleteCurrentMap);
        resetZoomBtn.addEventListener('click', resetZoom);

        ideaInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                runAnalysis();
            }
        });

        // LOAD SAVED MAP
        loadSavedMap();

        function setStatus(msg, type = 'neutral') {
            statusMessage.textContent = msg;
            statusMessage.className = 'mb-2 text-center text-xs ' +
                (type === 'error' ? 'text-hyper-coral font-semibold' :
                    type === 'success' ? 'text-electric-mint font-semibold' : 'text-medium-grey');
        }

        function addChatMessage(content, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex items-start gap-3 mt-3';

            if (isUser) {
                messageDiv.innerHTML = `
            <div class="flex size-10 items-center justify-center rounded-full bg-primary/20 text-primary flex-shrink-0">
                <span class="material-symbols-outlined">person</span>
            </div>
            <div class="rounded-2xl rounded-tl-none bg-primary/10 p-3">
                <p class="text-near-black text-xs">${content}</p>
            </div>
        `;
            } else {
                messageDiv.innerHTML = `
            <div class="flex size-10 items-center justify-center rounded-full bg-cyber-lavender/20 text-cyber-lavender flex-shrink-0">
                <span class="material-symbols-outlined">hub</span>
            </div>
            <div class="rounded-2xl rounded-tl-none bg-vapor-grey p-3">
                <p class="font-bold text-near-black text-sm">SynapMap</p>
                <p class="text-medium-grey text-xs">${content}</p>
            </div>
        `;
            }

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            setStatus('Leyendo archivo...', 'neutral');

            if (file.type.startsWith('text/') || file.name.endsWith('.txt')) {
                const text = await file.text();
                ideaInput.value = text;
                setStatus('✅ Archivo cargado', 'success');
            } else {
                setStatus(`📄 ${file.name} - Describe su contenido abajo`, 'success');
                ideaInput.placeholder = `Describe el contenido de "${file.name}"...`;
                ideaInput.focus();
            }
            fileInput.value = '';
        }

        async function runAnalysis() {
            const userInput = ideaInput.value.trim();
            if (!userInput) {
                setStatus('Por favor ingresa contenido para analizar', 'error');
                return;
            }

            addChatMessage(userInput, true);
            setStatus('🤖 Analizando con IA...', 'neutral');
            analyzeBtn.disabled = true;
            ideaInput.value = '';

            const systemPrompt = `Eres SynapMap, una IA que analiza proyectos y genera mapas de sistema con pensamiento sistémico.

TAREA: Analiza el input del usuario y genera:
1. **Mapa de Sistema**: Nodos (stakeholders, actividades, decisiones, sistemas) y conexiones (dependencias, flujo de información, recursos)
2. **Matriz RACI**: Para actividades/decisiones clave (Responsible, Accountable, Consulted, Informed)
3. **Análisis**: Cuellos de botella, riesgos, oportunidades, conflictos

FORMATO DE RESPUESTA (JSON estricto):
{
  "system_map": {
    "nodes": [
      {"id": "node1", "label": "Nombre", "category": "stakeholder|activity|decision|system"}
    ],
    "edges": [
      {"from": "node1", "to": "node2", "type": "dependency|information|resource", "label": "relación"}
    ]
  },
  "raci_matrix": [
    {"activity": "Actividad", "responsible": ["Persona1"], "accountable": ["Persona2"], "consulted": ["Persona3"], "informed": ["Persona4"]}
  ],
  "insights": {
    "bottlenecks": ["Descripción del cuello de botella"],
    "risks": ["Descripción del riesgo"],
    "opportunities": ["Descripción de oportunidad"],
    "conflicts": ["Descripción de conflicto"]
  },
  "summary": "Resumen breve del análisis"
}

REGLAS:
- Crea 8-15 nodos mínimo
- Identifica TODOS los stakeholders mencionados
- Mapea dependencias claramente
- Identifica cuellos de botella (nodos con muchas conexiones entrantes)
- RACI debe cubrir actividades clave
- Sé específico y accionable`;


            // Ofrecer datos demo
            setTimeout(() => {
                if (!currentAnalysis && confirm('¿Quieres cargar datos de demostración?')) {
                    loadDemoData();
                }
            }, 1000);
        } finally {
            analyzeBtn.disabled = false;
        }
        }

        let currentTransform = null;

        function renderSystemMap(data) {
            if (!data || !data.nodes) return;

            const container = d3.select('#system-map-svg');
            container.selectAll('*').remove();

            const width = document.getElementById('system-map-container').clientWidth;
            const height = document.getElementById('system-map-container').clientHeight;

            const svg = container
                .attr('width', width)
                .attr('height', height);

            const g = svg.append('g');

            const zoom = d3.zoom()
                .scaleExtent([0.1, 4])
                .on('zoom', (event) => {
                    currentTransform = event.transform;
                    g.attr('transform', event.transform);
                });

            svg.call(zoom);

            const simulation = d3.forceSimulation(data.nodes)
                .force('link', d3.forceLink(data.edges)
                    .id(d => d.id)
                    .distance(120)
                    .strength(0.5))
                .force('charge', d3.forceManyBody().strength(-400))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collide', d3.forceCollide().radius(40));

            const link = g.append('g')
                .selectAll('line')
                .data(data.edges)
                .join('line')
                .attr('stroke-width', 2)
                .on('mouseover', function (event, d) {
                    d3.select(this).attr('stroke', '#B2A4FF').attr('stroke-width', 4);
                    tooltip.style.opacity = 1;
                    tooltip.textContent = d.label || d.type;
                    tooltip.style.left = (event.pageX + 10) + 'px';
                    tooltip.style.top = (event.pageY - 10) + 'px';
                })
                .on('mouseout', function () {
                    d3.select(this).attr('stroke', 'rgba(178, 164, 255, 0.4)').attr('stroke-width', 2);
                    tooltip.style.opacity = 0;
                });

            const node = g.append('g')
                .selectAll('g')
                .data(data.nodes)
                .join('g')
                .call(d3.drag()
                    .on('start', (e, d) => {
                        if (!e.active) simulation.alphaTarget(0.3).restart();
                        d.fx = d.x; d.fy = d.y;
                    })
                    .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
                    .on('end', (e, d) => {
                        if (!e.active) simulation.alphaTarget(0);
                        d.fx = null; d.fy = null;
                    }));

            node.append('circle')
                .attr('r', d => d.category === 'system' ? 24 : 18)
                .attr('fill', d => {
                    if (d.category === 'stakeholder') return '#FF6B6B';
                    if (d.category === 'system') return '#B2A4FF';
                    if (d.category === 'decision') return '#66FFB2';
                    return '#5b13ec';
                })
                .attr('stroke', '#fff')
                .attr('stroke-width', 3)
                .style('filter', 'drop-shadow(0 2px 4px rgba(0,0,0,0.2))');

            node.append('text')
                .text(d => d.label)
                .attr('dy', 40)
                .attr('text-anchor', 'middle')
                .attr('fill', '#1A1A1A')
                .style('font-size', '11px')
                .style('font-weight', '600')
                .style('text-shadow', '0 1px 2px rgba(255,255,255,0.8)');

            simulation.on('tick', () => {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);
                node.attr('transform', d => `translate(${d.x},${d.y})`);
            });
        }

        function resetZoom() {
            const svg = d3.select('#system-map-svg');
            const zoom = d3.zoom();
            svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity);
            currentTransform = null;
        }

        function renderRaciMatrix(data) {
            const container = document.getElementById('raci-container');
            if (!data || !data.length) {
                container.innerHTML = '<p class="text-center text-medium-grey">No hay datos</p>';
                return;
            }

            let html = '<div class="space-y-2">';
            data.forEach(row => {
                html += `<div class="border border-vapor-grey rounded-lg p-2">
            <p class="font-bold text-near-black text-xs mb-1">${row.activity}</p>
            <div class="grid grid-cols-2 gap-1 text-xs">
                <div><span class="font-semibold text-primary">R:</span> ${(row.responsible || []).join(', ') || '-'}</div>
                <div><span class="font-semibold text-hyper-coral">A:</span> ${(row.accountable || []).join(', ') || '-'}</div>
                <div><span class="font-semibold text-electric-mint">C:</span> ${(row.consulted || []).join(', ') || '-'}</div>
                <div><span class="font-semibold text-medium-grey">I:</span> ${(row.informed || []).join(', ') || '-'}</div>
            </div>
        </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function renderInsights(insights) {
            const container = document.getElementById('insights-container');
            let html = '';

            const addSection = (title, items, emoji, color) => {
                if (!items || !items.length) return;
                html += `<div class="border-l-4 ${color} pl-2">`;
                html += `<h4 class="text-xs font-bold mb-1">${emoji} ${title}</h4>`;
                html += '<ul class="space-y-1">';
                items.forEach(item => html += `<li class="text-xs text-medium-grey">• ${item}</li>`);
                html += '</ul></div>';
            };

            if (insights) {
                addSection('Cuellos de Botella', insights.bottlenecks, '🚧', 'border-hyper-coral');
                addSection('Riesgos', insights.risks, '⚠️', 'border-yellow-500');
                addSection('Oportunidades', insights.opportunities, '✨', 'border-electric-mint');
                addSection('Conflictos', insights.conflicts, '⚡', 'border-primary');
            }

            container.innerHTML = html || '<p class="text-center text-medium-grey">No hay análisis</p>';
        }

        function saveCurrentMap() {
            if (!currentAnalysis) {
                setStatus('No hay mapa para guardar', 'error');
                return;
            }

            const mapData = {
                analysis: currentAnalysis,
                history: conversationHistory,
                timestamp: new Date().toISOString()
            };

            localStorage.setItem('synapmap_current', JSON.stringify(mapData));
            setStatus('✅ Mapa guardado', 'success');
            setTimeout(() => setStatus(''), 2000);
        }

        function loadSavedMap() {
            const saved = localStorage.getItem('synapmap_current');
            if (!saved) return;

            try {
                const mapData = JSON.parse(saved);
                currentAnalysis = mapData.analysis;
                conversationHistory = mapData.history || [];

                renderSystemMap(currentAnalysis.system_map);
                renderRaciMatrix(currentAnalysis.raci_matrix);
                renderInsights(currentAnalysis.insights);

                setStatus(`📂 Mapa cargado`, 'success');
            } catch (e) {
                console.error('Error al cargar:', e);
            }
        }

        function deleteCurrentMap() {
            if (confirm('¿Eliminar el mapa actual?')) {
                localStorage.removeItem('synapmap_current');
                currentAnalysis = null;
                conversationHistory = [];

                d3.select('#system-map-svg').selectAll('*').remove();
