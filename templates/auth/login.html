<!DOCTYPE html>
<html class="light" lang="en" data-theme="{{ (user.get('prefs') or {}).get('theme', 'dark') if user is defined and user else 'dark' }}" data-motion="{{ (user.get('prefs') or {}).get('motion', 'full') if user is defined and user else 'full' }}" data-focus="{{ (user.get('prefs') or {}).get('focus', 'off') if user is defined and user else 'off' }}">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Client Login | Vertex 4D</title>
    <link rel="icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style type="text/tailwindcss">
        
        
        .noise-texture {
            position: relative;
        }
        .noise-texture::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("/static/brand/textures/paper-grain-overlay.png");
            opacity: 0.03;
            pointer-events: none;
            z-index: -1;
        }
        
        .card-3d {
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .card-3d:hover {
            border-color: #1946D1;
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1946D1",
                        "cyber-lavender": "#E74530",
                        "electric-mint": "#A4A760",
                        "background-dark": "#181810",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "heading": ["Bricolage Grotesque", "sans-serif"],
                    },
                },
            },
        }
    </script>
    <link rel="stylesheet" href="/static/css/vertex4d.css">
    <script src="/static/js/prefs.js" defer></script>
</head>

<body
    class="auth-shell font-display bg-gray-50 text-gray-900 noise-texture min-h-screen flex items-center justify-center relative overflow-hidden">

    <div class="relative z-10 w-full max-w-md px-4">
        <div class="text-center mb-8">
            <a href="/" class="inline-flex flex-col items-center gap-3 group">
                <span class="auth-logo brand-lockup">
                    <span class="brand-mark">SL</span>
                    <span class="brand-wordmark">Srsly Labs</span>
                </span>
                <span class="vertex-product-label">Vertex 4D</span>
            </a>
            <h2 class="mt-6 text-2xl font-bold tracking-tight text-gray-900">Welcome back to Vertex 4D.</h2>
        </div>

        <div class="auth-card bg-white/80 backdrop-blur-xl px-8 py-10 shadow-2xl rounded-2xl card-3d border border-white/50">
            {% if error %}
            <div class="mb-6 rounded-lg bg-red-50 p-4 border border-red-100 flex items-center gap-3">
                <svg class="h-5 w-5 text-red-500 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                        clip-rule="evenodd" />
                </svg>
                <h3 class="text-sm font-medium text-red-800">{{ error }}</h3>
            </div>
            {% endif %}

            <form class="space-y-6" action="/login" method="POST">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 ml-1">Email address</label>
                    <div class="mt-1 relative">
                        <input id="email" name="email" type="email" autocomplete="email" required
                            class="block w-full rounded-xl border-gray-200 bg-gray-50/50 px-4 py-3 shadow-sm focus:border-primary focus:ring-primary sm:text-sm transition-all hover:bg-white focus:bg-white">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 ml-1">Profile Password</label>
                    <div class="mt-1 relative">
                        <input id="password" name="password" type="password" autocomplete="current-password" required
                            class="block w-full rounded-xl border-gray-200 bg-gray-50/50 px-4 py-3 shadow-sm focus:border-primary focus:ring-primary sm:text-sm transition-all hover:bg-white focus:bg-white">
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox"
                            class="h-4 w-4 rounded border-gray-300 text-primary focus:ring-primary">
                        <label for="remember-me" class="ml-2 block text-sm text-gray-600">Remember me</label>
                    </div>

                    <div class="text-sm">
                        <a href="#" class="font-medium text-primary hover:text-primary/80 transition-colors">Forgot
                            password?</a>
                    </div>
                </div>

                <div>
                    <button type="submit"
                        class="group relative flex w-full justify-center rounded-xl border border-transparent bg-primary py-3 px-4 text-sm font-bold text-white shadow-lg hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all hover:scale-[1.02] active:scale-[0.98]">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                            <svg class="h-5 w-5 text-white/50 group-hover:text-white transition-colors"
                                viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                <path fill-rule="evenodd"
                                    d="M10 1a4.5 4.5 0 00-4.5 4.5V9H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-.5V5.5A4.5 4.5 0 0010 1zm3 8V5.5a3 3 0 10-6 0V9h6z"
                                    clip-rule="evenodd" />
                            </svg>
                        </span>
                        Access profile
                    </button>
                </div>
            </form>

            <div class="mt-8 text-center">
                <p class="text-sm text-gray-600">
                    Need a profile?
                    <a href="/register" class="font-bold text-primary hover:text-primary/80 transition-colors">Start
                        your profile</a>
                </p>
            </div>
        </div>
    </div>
</body>

</html>
